aid: kamal-deploy
name: Kamal
reviewer: Kin Lane
reviewed: '2026-05-25'
type: opensource
tier: 2
summary: >-
  Kamal is 37signals' (DHH/Basecamp) open-source zero-downtime deployer for
  containerized web apps. It is a Ruby CLI that drives Docker over SSH using
  SSHKit, paired with kamal-proxy — a small Go HTTP proxy — to atomically
  switch traffic between old and new containers based on health checks.
  Configuration is a single `config/deploy.yml` covering servers, image,
  registry, accessories, env, secrets, and proxy/TLS. There is no hosted
  service, no REST API, no SDK surface beyond the RubyGem, and no commercial
  tier — Kamal is the deployment backbone behind 37signals' on-prem exit and
  their ONCE product line.
findings:
  - area: APIs
    note: >-
      No public REST or HTTP API. The product surface is the `kamal` Ruby CLI
      and the `kamal-proxy` Go CLI. Catalog as Tier-2 (CLI, not REST API).
  - area: Specs
    note: >-
      No OpenAPI, AsyncAPI, JSON Schema, or other machine-readable contract
      published by the project. Do not generate placeholder specs — per
      run-pipeline.md, empty spec files are forbidden.
  - area: Open Source
    note: >-
      MIT License. Two primary repos under github.com/basecamp — `kamal`
      (Ruby, ~14k stars, latest v2.11.0) and `kamal-proxy` (Go, ~1k stars).
      Companion repos `kamal-site` (docs) and `kamal-skiff` (static sites via
      Kamal) are useful integrations.
  - area: Packaging
    note: >-
      Distributed as the `kamal` RubyGem (`gem install kamal`). A Dockerfile
      is also published for running Kamal itself in a container when Ruby is
      unavailable on the workstation.
  - area: Governance
    note: >-
      Vendored by 37signals; primary maintainer is DHH. Development happens
      openly on GitHub with public Discussions and a community Discord.
  - area: Commercial
    note: >-
      Pure FOSS, no hosted tier. Plans/RateLimits/FinOps pipeline steps are
      not applicable.
