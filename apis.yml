apis:
  - aid: kamal-deploy:kamal
    name: Kamal CLI
    description: >-
      The Kamal CLI (`kamal`) is the primary command-line interface for
      packaging, shipping, and operating containerized web apps across one or
      more SSH-reachable servers. It reads `config/deploy.yml` (plus
      environment-specific overlays and encrypted secrets) and orchestrates
      the full lifecycle: building images, pushing to a registry, provisioning
      Docker on target hosts, starting accessory services, deploying the app
      via kamal-proxy with health-check gated traffic switching, and tailing
      logs or rolling back to a prior version. Command groups include `app`,
      `accessory`, `build`, `proxy`, `registry`, `secrets`, `server`, and
      `prune`, plus top-level shortcuts like `deploy`, `redeploy`, `rollback`,
      `setup`, `audit`, `details`, `env`, `lock`, `version`, and `init`.
    humanURL: https://kamal-deploy.org/docs/
    tags:
      - CLI
      - Deployment
      - Docker
      - Rails
      - Ruby
      - SSH
