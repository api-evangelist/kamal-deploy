aid: kamal-deploy
name: Kamal
description: >-
  Kamal is an open-source deployment tool from 37signals (DHH / Basecamp) for
  deploying containerized web applications to any infrastructure — bare metal,
  cloud VMs, or a mix — with zero-downtime rolling restarts. Originally built
  for Rails apps, Kamal works with any web application that can be packaged as
  a Docker container. It uses SSHKit to drive remote commands over SSH and
  pairs with kamal-proxy, a lightweight HTTP proxy written in Go that
  seamlessly switches request traffic between old and new containers during a
  deploy. Kamal is imperative and Capistrano-like in feel, with a single
  `config/deploy.yml` describing servers, image, registry, accessories, env,
  secrets, and proxy/SSL settings. Capabilities include auto-provisioning
  Docker on new servers, remote builds, asset bridging, accessory services
  (databases, Redis, cron sidecars), automatic TLS via Let's Encrypt, host-
  and path-based routing, and hooks for custom pre/post-deploy logic. Kamal is
  the operational backbone of 37signals' on-premises exit from major cloud
  providers and powers their ONCE product line. Kamal itself is a CLI tool,
  not a hosted service — there is no public REST API, no SDK, and no paid
  tier. The project is released under the MIT License and developed openly on
  GitHub under the `basecamp` organization.
